# Release workflow: when a version tag (v1.2.3) is pushed, run the tests, build
# the single-file AutoMouseMover.exe and attach it to the GitHub release for that tag.
#
# Usage:
#   1. Bump <Version> in AutoMouseMover/AutoMouseMover.csproj and add a "# 1.2.3"
#      section to CHANGELOG.md (it becomes the release notes)
#   2. git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags:
      - "v*"

# The job needs write access to create the release and upload the exe
permissions:
  contents: write

jobs:
  release:
    # WPF and the Windows-only tests need a Windows runner
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run the tests
        run: dotnet test --configuration Release

      - name: Build the single-file exe
        run: dotnet publish AutoMouseMover/AutoMouseMover.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

      - name: Create the release and attach the exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "AutoMouseMover/bin/Release/net8.0-windows/win-x64/publish/AutoMouseMover.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash

          # Release notes: the CHANGELOG.md section whose heading matches the tag
          # without the "v" (e.g. "# 2.0.1" for v2.0.1), up to the next heading
          $version = $tag.TrimStart("v")
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^#\s+(.+?)\s*$') {
              $inSection = ($Matches[1] -eq $version)
              continue
            }
            if ($inSection) { $notes += $line }
          }
          if ($notes.Count -eq 0) { $notes = @("Release $tag") }
          $notes += ""
          $notes += "SHA256 of AutoMouseMover.exe: ``$hash``"
          $notes += ""
          $notes += "The file is not code-signed, so Windows SmartScreen may warn on first run (More info, then Run anyway)."
          $notes -join "`n" | Set-Content notes.md -Encoding utf8

          # Re-running for an existing release (e.g. created by hand) replaces the exe
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "Version $version" --notes-file notes.md
          }
